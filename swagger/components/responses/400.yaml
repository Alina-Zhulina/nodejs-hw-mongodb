description: BadRequestError
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: 'BadRequestError'
        data:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              enum:
                - 'Invalid contact ID. Please provide a valid ID.'
                - '"FieldName" is required'
              example: 'Invalid contact ID. Please provide a valid ID.'
    examples:
      InvalidContactId:
        summary: 'Invalid contact ID'
        value:
          status: 400
          message: 'BadRequestError'
          data:
            message: 'Invalid contact ID. Please provide a valid ID.'
      RequiredFieldIs:
        summary: 'Required field missing'
        value:
          status: 400
          message: 'BadRequestError'
          data:
            message: '"FieldName" is required'
