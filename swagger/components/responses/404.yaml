description: 'NotFound error'
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          example: 'NotFoundError'
        data:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              enum:
                - 'Route not found'
                - 'Contact not found'
                - 'User not found'
              example: 'Route not found'
    examples:
      routeNotFound:
        summary: 'Route not found'
        value:
          status: 404
          message: 'NotFoundError'
          data:
            message: 'Route not found'
      contactNotFound:
        summary: 'Contact not found'
        value:
          status: 404
          message: 'NotFoundError'
          data:
            message: 'Contact not found'
      userNotFound:
        summary: 'User not found'
        value:
          status: 404
          message: 'NotFoundError'
          data:
            message: 'User not found'
