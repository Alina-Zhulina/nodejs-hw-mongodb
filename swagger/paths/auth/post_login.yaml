tags:
  - Auth
summary: Login User
operationId: loginUser
description: 'Login user in app system'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: "User's email address"
            type: string
            format: email
            example: 'example@mail.com'
          password:
            description: "User's password"
            type: string
            example: 'yourpassword123'
responses:
  '200':
    description: 'Successfully logged in an user!'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              description: 'HTTP status code indicating success'
              example: 200
            message:
              type: string
              description: 'Confirmation message'
              example: 'Successfully logged in an user!'
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  description: 'JWT access token for authenticated user'
                  example: 'z5vu7q9h87KAe1ghvoHkm57IBa+Cl3ZMUCX6wwa8'
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
  '400':
    $ref: ../../components/responses/400.yaml
