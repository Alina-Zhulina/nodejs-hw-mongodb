tags:
  - Auth
summary: Send password reset email
operationId: sendResetEmail
description: 'Sends a password reset email to the user with a link to reset the password.'
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            type: string
            description: 'The email address associated with the user account.'
            example: 'example@mail.com'
responses:
  '200':
    description: 'Password reset email has been successfully sent.'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              description: 'HTTP status code indicating success.'
              example: 200
            message:
              type: string
              description: 'Confirmation message that the email has been sent.'
              example: 'Reset password email has been successfully sent.'
            data:
              type: object
              description: 'Empty object, as no additional data is returned.'
              additionalProperties: false
  '404':
    $ref: '../../components/responses/404.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
