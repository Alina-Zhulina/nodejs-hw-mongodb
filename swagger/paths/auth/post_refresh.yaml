tags:
  - Auth
summary: Refresh User Session
operationId: refreshUserSession
description: 'Refreshes the user session by validating the refresh token and session ID from the cookies, creating a new session, and returning a new access token.'
security:
  - bearerAuth: []
responses:
  '200':
    description: 'Successfully refreshed the session'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              description: 'HTTP status code indicating success'
              example: 200
            message:
              type: string
              description: 'Confirmation message'
              example: 'Successfully refreshed a session!'
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  description: 'New JWT access token for the user.'
                  example: 'newAccessToken123'
  '404':
    $ref: '../../components/responses/404.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
