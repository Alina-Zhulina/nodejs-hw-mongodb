tags:
  - Auth
summary: Register User
operationId: registerUser
description: 'Register user with provided details'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: "User's name (minimum 3 characters, maximum 20 characters)"
            type: string
            minLength: 3
            maxLength: 20
            example: 'Anna Hryhorash'
          email:
            description: "User's email address"
            type: string
            format: email
            example: 'example@mail.com'
          password:
            description: "User's password"
            type: string
            example: 'yourpassword123'
responses:
  '201':
    description: 'User successfully registered'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              description: 'HTTP status code indicating success'
              example: 201
            message:
              type: string
              description: 'Confirmation message'
              example: 'Successfully registered a user!'
            data:
              $ref: ../../components/schemas/user.yaml
  '409':
    $ref: '../../components/responses/409.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
  '400':
    $ref: ../../components/responses/400.yaml
