tags:
  - Auth
summary: Logout User
operationId: logoutUser
description: 'Logs the user out of the system by clearing session cookies and deleting the session from the database. Requires valid authentication token.'
security:
  - bearerAuth: []
responses:
  '204':
    description: 'Successfully logged out the user. The session is deleted, and cookies are cleared.'
  '404':
    $ref: '../../components/responses/404.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
