tags:
  - Auth
summary: Reset Password
operationId: resetPassword
description: 'Allows a user to reset their password by providing a valid token received via email.'
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          password:
            type: string
            description: 'The new password to be set for the user.'
            example: 'newPassword1234'
          token:
            type: string
            description: 'The token received via email to verify the reset request.'
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI1YjE0NjMxZC1hNDRjLTQxNjItYjQ5YjM0ZDE0MzZkZiIsImVtYWlsIjoic2FtcGxlQGVtYWlsLmNvbSIsImlhdCI6MTYyNTI4OTQwNSwiZXhwIjoxNjI1MjkzMDA1fQ.MfkwD6m3g6fyqLMv4LZIrBBhQwexg1-Lf8lhP9rC7Qw'
        required:
          - password
          - token
responses:
  '200':
    description: 'Password has been successfully reset.'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              description: 'HTTP status code indicating success.'
              example: 200
            message:
              type: string
              description: 'Confirmation message indicating the password has been updated.'
              example: 'Password has been successfully reset.'
            data:
              type: object
              description: 'Empty object as no additional data is returned.'
  '404':
    $ref: '../../components/responses/404.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '400':
    $ref: '../../components/responses/400.yaml'
