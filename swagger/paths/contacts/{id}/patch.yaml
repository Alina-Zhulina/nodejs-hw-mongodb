tags:
  - Contacts
summary: Update a contact
operationId: updateContact
description: 'Update contact details with provided fields.'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    description: 'The ID of the contact to be updated'
    required: true
    schema:
      type: string
      example: '60d5f0f5f41e3b001f1a63a5'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: 'Name of the contact'
            example: 'Anna Hryhorash'
          email:
            type: string
            description: 'Email of the contact'
            example: 'example@mail.com'
          phoneNumber:
            type: string
            description: 'Phone number of the contact'
            example: '123432555'
          isFavourite:
            description: 'Whether the contact is in the favorites list'
            type: boolean
            example: true
          contactType:
            type: string
            description: 'Type of the contact (work, home, personal)'
            enum:
              - 'work'
              - 'home'
              - 'personal'
            example: 'work'
          photo:
            description: "Upload contact's photo in binary format"
            type: string
            format: binary
responses:
  '200':
    description: 'Contact successfully updated'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully patched a contact!'
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml

  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '400':
    $ref: '../../../components/responses/400.yaml'
