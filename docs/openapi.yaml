openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts app
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: This is a documentation of contacts app
tags:
  - name: Contacts
    description: Operations about users.
  - name: Auth
    description: Auth operations.
servers:
  - url: https://nodejs-hw-mongodb-4coj.onrender.com
paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml
  /contacts/{id}:
    get:
      $ref: ../swagger/paths/contacts/{id}/get.yaml
    patch:
      $ref: ../swagger/paths/contacts/{id}/patch.yaml
    delete:
      $ref: ../swagger/paths/contacts/{id}/delete.yaml
  /auth/register:
    post:
      $ref: ../swagger/paths/auth/post_register.yaml
  /auth/login:
    post:
      $ref: ../swagger/paths/auth/post_login.yaml
  /auth/logout:
    post:
      $ref: ../swagger/paths/auth/post_logout.yaml
  /auth/refresh:
    post:
      $ref: ../swagger/paths/auth/post_refresh.yaml
  /auth/send-reset-email:
    post:
      $ref: ../swagger/paths/auth/post_send_reset_email.yaml
  /auth/reset_password:
    post:
      $ref: ../swagger/paths/auth/post_reset_password.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
